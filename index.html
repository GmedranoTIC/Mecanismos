    <script>
      // Si se accede a GitHub Pages sin la barra final (ej. /Mecanismos en lugar de /Mecanismos/)
      // los navegadores resuelven ./assets al dominio raíz causando 404 (pantalla en blanco).
      if (location.hostname.endsWith('github.io') && !location.pathname.endsWith('/') && !location.pathname.includes('.')) {
        location.replace(location.pathname + '/' + location.search + location.hash);
      }
    </script>
